
[opener]
edit = [{ run = 'nvim "$@"', block = true, desc = "Neovim" }]
image = [{ run = 'gthumb "$@"', orphan = true, desc = "GThumb" }]
pdf = [{ run = 'okular "$@"', orphan = true, desc = "Okular" }]
video = [{ run = 'mpv "$@"', orphan = true, desc = "mpv" }]
open = [{ run = 'xdg-open "$@"', orphan = true, desc = "System default" }]

[open]
rules = [
  # “Plain text-ish” → nvim
  { mime = "text/*", use = "edit" },
  { mime = "application/json", use = "edit" },
  { mime = "application/x-yaml", use = "edit" },
  { mime = "application/yaml", use = "edit" },
  { mime = "application/toml", use = "edit" },
  { mime = "application/xml", use = "edit" },
  { mime = "application/x-sh", use = "edit" },

  # Media → GUI players/viewers
  { mime = "image/*", use = "image" },
  { mime = "application/pdf", use = "pdf" },
  { mime = "video/*", use = "video" },

  # Everything else → desktop defaults
  { mime = "*", use = "open" },
]
