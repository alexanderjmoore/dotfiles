##### ~/.tmux.conf
#
# Neovim-oriented tmux configuration
# Catppuccin Mocha
# No plugins required.
#

# ---------------------------------------------------------------------------
# Terminal / Neovim integration
# ---------------------------------------------------------------------------

# Advertise a capable terminal inside tmux.
set -g default-terminal "tmux-256color"

# Tell tmux that terminals support truecolor/RGB.
# Important for Neovim themes such as Catppuccin Mocha.
set -as terminal-features ",*:RGB"

# Minimize the delay tmux introduces when distinguishing Escape from
# Alt/Meta sequences.
set -sg escape-time 10

# Let applications such as Neovim know when the terminal gains/loses focus.
set -g focus-events on

# Large scrollback.
set -g history-limit 100000


# ---------------------------------------------------------------------------
# Prefix
# ---------------------------------------------------------------------------

# Remove the default Ctrl-b prefix.
unbind C-b

# Ctrl-Space is comfortable to reach and stays out of the way of normal
# Vim/Neovim navigation.
set -g prefix C-Space

# Ctrl-Space Ctrl-Space sends a literal Ctrl-Space to the application.
bind C-Space send-prefix


# ---------------------------------------------------------------------------
# General behavior
# ---------------------------------------------------------------------------

# Start numbering windows and panes at 1.
set -g base-index 1
setw -g pane-base-index 1

# Renumber windows after one is closed.
set -g renumber-windows on

# Enable mouse support for:
# - selecting panes
# - resizing panes
# - scrolling
# - selecting windows from the status bar
set -g mouse on

# Vi controls in scroll/copy mode.
setw -g mode-keys vi
set -g status-keys vi

# Repeat window for bindings intentionally marked with -r.
#
# Kept fairly short so tmux returns control to applications quickly.
set -g repeat-time 250

# Don't exit the client merely because the current session disappears
# if another session still exists.
set -g detach-on-destroy off

# Update the terminal title.
set -g set-titles on
set -g set-titles-string "#S:#I.#P #W"


# ---------------------------------------------------------------------------
# Reload configuration
# ---------------------------------------------------------------------------

# Prefix + r
bind r source-file ~/.tmux.conf \; display-message "tmux.conf reloaded"


# ---------------------------------------------------------------------------
# Creating windows / panes
# ---------------------------------------------------------------------------

# New windows inherit the current pane's working directory.
unbind c
bind c new-window -c "#{pane_current_path}"

# More intuitive split bindings:
#
#   Prefix |    side-by-side
#   Prefix -    top/bottom
#
# New panes inherit the current pane's working directory.

unbind '"'
unbind %

bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"


# ---------------------------------------------------------------------------
# Pane navigation
# ---------------------------------------------------------------------------

# Prefix + h/j/k/l
#
# Deliberately prefixed so Neovim keeps ownership of its own navigation keys.

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Override tmux's default repeatable arrow bindings.
#
# These are intentionally NOT marked with -r. Pane navigation should happen
# once and immediately return keyboard input to Neovim/the shell.

bind Left  select-pane -L
bind Down  select-pane -D
bind Up    select-pane -U
bind Right select-pane -R


# ---------------------------------------------------------------------------
# Pane resizing
# ---------------------------------------------------------------------------

# Prefix + H/J/K/L
#
# These ARE intentionally repeatable:
#
#   Ctrl-Space H H H H

bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5


# ---------------------------------------------------------------------------
# Window organization
# ---------------------------------------------------------------------------

# Prefix + < / >
#
# Physically reorder the current window.

bind -r '<' swap-window -t -1
bind -r '>' swap-window -t +1

# Prefix + Tab
#
# Jump to the previously selected window.
bind Tab last-window

# Prefix + Space
#
# Cycle through tmux's built-in pane layouts.
bind Space next-layout


# ---------------------------------------------------------------------------
# Copy mode
# ---------------------------------------------------------------------------

# Prefix + [
#
# enters copy mode.
#
# Inside copy mode:
#
#   v       begin selection
#   V       select whole lines
#   Ctrl-v  rectangular selection
#   y       yank and leave copy mode
#   Escape  cancel

bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi V send-keys -X select-line
bind -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind -T copy-mode-vi y send-keys -X copy-selection-and-cancel
bind -T copy-mode-vi Escape send-keys -X cancel

# Allow tmux to use the terminal's clipboard mechanism where supported.
# Particularly useful with terminals supporting OSC 52.
set -s set-clipboard on


# ---------------------------------------------------------------------------
# Activity
# ---------------------------------------------------------------------------

# Mark windows where something happened without throwing visual messages
# over the active application.
setw -g monitor-activity on
set -g visual-activity off


# ===========================================================================
# Catppuccin Mocha
# ===========================================================================

# Palette reference:
#
# crust     #11111b
# mantle    #181825
# base      #1e1e2e
# surface0  #313244
# surface1  #45475a
# text      #cdd6f4
# subtext0  #a6adc8
# lavender  #b4befe
# blue      #89b4fa
# mauve     #cba6f7
# green     #a6e3a1
# yellow    #f9e2af
# peach     #fab387
# red       #f38ba8
# teal      #94e2d5


# ---------------------------------------------------------------------------
# Panes
# ---------------------------------------------------------------------------

# Quiet border for inactive panes.
set -g pane-border-style "fg=#313244"

# Mauve border makes the active tmux pane immediately obvious.
set -g pane-active-border-style "fg=#cba6f7"

# Pane numbers displayed by Prefix + q.
set -g display-panes-colour "#6c7086"
set -g display-panes-active-colour "#cba6f7"


# ---------------------------------------------------------------------------
# Messages / menus / copy mode
# ---------------------------------------------------------------------------

set -g message-style "bg=#313244,fg=#cdd6f4"
set -g message-command-style "bg=#313244,fg=#89b4fa"

# Selection/highlight color while in copy mode.
setw -g mode-style "bg=#cba6f7,fg=#1e1e2e,bold"

set -g clock-mode-colour "#cba6f7"


# ---------------------------------------------------------------------------
# Status bar
# ---------------------------------------------------------------------------

# Keep tmux's workspace UI at the top, spatially separated from Neovim's
# statusline/mode information at the bottom.
set -g status-position top

set -g status-interval 5

set -g status-style "bg=#181825,fg=#cdd6f4"

set -g status-left-length 40
set -g status-right-length 100


# Left:
#
#   session-name

set -g status-left \
"#[bg=#cba6f7,fg=#1e1e2e,bold] #S #[bg=#181825,fg=#cdd6f4] "


# Inactive windows.
set -g window-status-format \
"#[bg=#181825,fg=#a6adc8] #I:#W "

# Current window.
#
# Catppuccin blue now works cleanly because the tmux bar lives at the top,
# away from Neovim's blue mode indicator at the bottom.

set -g window-status-current-format \
"#[bg=#89b4fa,fg=#1e1e2e,bold] #I:#W "

# Window with activity.
setw -g window-status-activity-style "fg=#f9e2af,bg=#181825,bold"

set -g window-status-separator ""


# Right side:
#
#   PREFIX     appears only while Ctrl-Space is active
#   directory  basename of current pane's working directory
#   time
#
# The comma inside the style expression must be escaped as #, because this
# style appears inside a tmux conditional expression.

set -g status-right \
"#{?client_prefix,#[bg=#f38ba8]#[fg=#1e1e2e#,bold] PREFIX #[bg=#181825] ,}#[fg=#b4befe] #{b:pane_current_path}  #[fg=#6c7086]| #[fg=#cdd6f4]%H:%M "


# ---------------------------------------------------------------------------
# End
# ---------------------------------------------------------------------------
